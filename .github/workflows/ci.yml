name: CI

# Restores the guardrail gate removed in 38c87cd. One job, one install, runs the
# existing package.json scripts — no new checks invented. Gates GitHub; enable
# "required status checks" in repo/Vercel settings to also block deploys.

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # @sovereignsquad/gds-* install from vendored release tarballs (vendor/gds/,
      # pinned by package.json + overrides), not from GitHub Packages, so this job
      # needs no registry token and is immune to the org's Packages quota
      # (v12.3.29: two days of 403s at npm ci were the trigger).
      # Dummy values so `next build` doesn't fail on missing runtime config.
      MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/test' }}
      DB_NAME: ${{ secrets.DB_NAME || 'messmass_test' }}
      # `puppeteer` (devDependency, local-dev-only PDF export fallback — see
      # app/api/export/pdf/route.ts) downloads its own ~150-300MB Chromium build on
      # every `npm install` by default. CI never executes it (it only needs the
      # package present for type-checking), so skip that download here.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run style:check
      - run: npm run version:verify
      - run: npm run docs:audit
      # Fleet anti-rot (messmass#355): docs/_audit/*.json must match the code.
      # Regenerate with `python3 scripts/fleet-audit-inventory.py --write`.
      - run: npm run inventory:check
      # Catches exactly the failure that motivated this: package.json
      # declaring one GDS version while node_modules silently ran a stale,
      # unrelated one for three majors because npm install was never re-run
      # after the vendor bump. This runs on every push now, not just when
      # someone happens to remember.
      - run: npm run gds:sync
      # Blocking since v12.3.26 (messmass#387): the 71 forbidden-color findings
      # were cleared -- UI colours moved to theme.css tokens, and the colours
      # that are data (chart palettes, seeded style presets, hashtag colours,
      # e-mail inline styles) live in lib/theme/*.ts, the one lane the checker
      # exempts. A new raw hex/rgb literal outside lib/theme/ now fails CI.
      # compliance.strictMode stays false; strict mode is separate Phase 5 work.
      - run: npx gds-compliance check --manifest ./gds-adoption.json
      - run: npx tsx scripts/check-dependency-guardrail.ts
      - run: npx tsx scripts/check-layout-grammar-guardrail.ts
      - run: npm run build
